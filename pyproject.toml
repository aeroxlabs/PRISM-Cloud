[project]
name = "prism-cloud-api"
version = "1.1.0"
description = "AeroxLabs PRISM message threat-detection API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.10,<3",
    "xgboost>=2.1,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "numpy>=1.26,<3",
    "joblib>=1.3,<2",
    "python-dotenv>=1.0,<2",
]

[tool.fastapi]
entrypoint = "main:app"
